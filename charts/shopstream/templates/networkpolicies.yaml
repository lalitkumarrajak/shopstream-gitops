{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
{{- $release := .Release.Name -}}
{{- $infra := "shopstream-infra" -}}
{{- $ingressNs := dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.ingressControllerNamespace) -}}
{{- $monitoringNs := dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.monitoringNamespace) -}}
{{- $pod := dict -}}
{{/* Default deny: every pod in the namespace starts with no ingress and no egress. */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $release }}-default-deny
  labels:
    app.kubernetes.io/part-of: shopstream
    app.kubernetes.io/instance: {{ $release }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
{{- $nats := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "nats" "app.kubernetes.io/instance" $infra)) "ports" (list (dict "port" 4222 "protocol" "TCP")) -}}
{{- $mongo := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "mongodb" "app.kubernetes.io/instance" $infra)) "ports" (list (dict "port" 27017 "protocol" "TCP")) -}}
{{- $pg := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "postgresql" "app.kubernetes.io/instance" $infra)) "ports" (list (dict "port" 5432 "protocol" "TCP")) -}}
{{- $external := list -}}
{{- if $np.externalDatabases.enabled -}}
{{- $ports := list -}}
{{- range $np.externalDatabases.ports }}{{ $ports = append $ports (dict "port" . "protocol" "TCP") }}{{ end -}}
{{- $external = list (dict "ipBlock" (dict "cidr" $np.externalDatabases.cidr "except" $np.externalDatabases.except) "ports" $ports) -}}
{{- end -}}
{{- $otel := list -}}
{{- if $np.otelCollectorNamespace -}}
{{- $otel = list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.otelCollectorNamespace)) "ports" (list (dict "port" 4318 "protocol" "TCP") (dict "port" 4317 "protocol" "TCP"))) -}}
{{- end -}}
{{- $scrape := dict "namespaceSelector" $monitoringNs -}}
{{- $fromGateway := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "gateway" "app.kubernetes.io/instance" $release)) -}}

{{- if .Values.gateway.enabled }}
{{- $subgraphs := list -}}
{{- range $s := list "catalog" "orders" "payments" "notifications" }}
{{- $subgraphs = append $subgraphs (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" $s "app.kubernetes.io/instance" $release)) "ports" (list (dict "port" (index $.Values $s).port "protocol" "TCP"))) -}}
{{- end }}
{{ include "shopstream-lib.networkPolicy" (dict "root" $ "name" "gateway" "c" .Values.gateway
  "from" (list (dict "namespaceSelector" $ingressNs "ports" (list (dict "port" .Values.gateway.port "protocol" "TCP"))) (merge (dict "ports" (list (dict "port" .Values.gateway.port "protocol" "TCP"))) $scrape))
  "egressTo" (concat $subgraphs (list $mongo) $external $otel)) }}
{{- end }}

{{- range $s := list "catalog" "payments" "notifications" }}
{{- if (index $.Values $s).enabled }}
{{ include "shopstream-lib.networkPolicy" (dict "root" $ "name" $s "c" (index $.Values $s)
  "from" (list (merge (dict "ports" (list (dict "port" (index $.Values $s).port "protocol" "TCP"))) $fromGateway) (merge (dict "ports" (list (dict "port" (index $.Values $s).port "protocol" "TCP"))) $scrape))
  "egressTo" (concat (list $nats $mongo) $external $otel)) }}
{{- end }}
{{- end }}

{{- if .Values.orders.enabled }}
{{ include "shopstream-lib.networkPolicy" (dict "root" $ "name" "orders" "c" .Values.orders
  "from" (list (merge (dict "ports" (list (dict "port" .Values.orders.port "protocol" "TCP"))) $fromGateway) (merge (dict "ports" (list (dict "port" .Values.orders.port "protocol" "TCP"))) $scrape))
  "egressTo" (concat (list $nats $pg) $external $otel)) }}
{{- end }}

{{- if .Values.web.enabled }}
{{ include "shopstream-lib.networkPolicy" (dict "root" $ "name" "web" "c" .Values.web
  "from" (list (dict "namespaceSelector" $ingressNs "ports" (list (dict "port" .Values.web.port "protocol" "TCP"))))
  "egressTo" (list)) }}
{{- end }}

{{- if .Values.migrations.enabled }}
{{ include "shopstream-lib.networkPolicy" (dict "root" $ "name" "migrations" "c" (dict "component" "migration" "image" (dict "tag" "")) 
  "from" (list)
  "egressTo" (concat (list $pg) $external)) }}
{{- end }}
{{- end }}
