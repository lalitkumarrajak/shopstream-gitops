{{- $s := .Values.secret -}}
{{- if $s.create }}
{{- $pgHost := printf "%s-postgresql" .Release.Name -}}
{{- $pg := .Values.postgresql -}}
{{- $mongoHost := printf "%s-mongodb-0.%s-mongodb-headless.%s.svc.cluster.local:27017" .Release.Name .Release.Name .Release.Namespace -}}
# DEV-ONLY: rendered from values. Production uses externalSecret or sealedSecret (see README).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.name }}
  labels:
    {{- include "infra.labels" (dict "root" $ "name" "app-secret" "component" "secret") | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secret.jwtSecret is required when secret.create=true" $s.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ include "infra.pgPassword" . | quote }}
  DATABASE_URL: {{ $s.databaseUrl | default (printf "postgresql://%s:%s@%s:5432/%s" $pg.username (include "infra.pgPassword" .) $pgHost $pg.database) | quote }}
  DIRECT_URL: {{ $s.directUrl | default $s.databaseUrl | default (printf "postgresql://%s:%s@%s:5432/%s" $pg.username (include "infra.pgPassword" .) $pgHost $pg.database) | quote }}
  MONGODB_URI: {{ $s.mongodbUri | default (printf "mongodb://%s/?replicaSet=%s" $mongoHost .Values.mongodb.replicaSetName) | quote }}
{{- end }}
{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  labels:
    {{- include "infra.labels" (dict "root" $ "name" "app-secret" "component" "secret") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ $s.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
{{- if .Values.sealedSecret.enabled }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $s.name }}
  labels:
    {{- include "infra.labels" (dict "root" $ "name" "app-secret" "component" "secret") | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml .Values.sealedSecret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ $s.name }}
    type: Opaque
{{- end }}
