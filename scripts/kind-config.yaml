# Single-node kind cluster for ShopStream. ingress-nginx binds the node's port 80,
# published on the host as http://localhost:4780.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shopstream
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 4780
        listenAddress: "127.0.0.1"
        protocol: TCP
