# prod — manual sync: promote by setting the image tag to a SHA that is green in dev
# (scripts/promote.sh), review the PR, then press "Sync" in Argo CD.
global:
  image:
    # Immutable git SHA promoted from dev by scripts/promote.sh (reviewed PR).
    # "unreleased" until the first promotion — prod never runs a mutable tag.
    tag: unreleased

commonEnv:
  LOG_LEVEL: info
  CORS_ORIGINS: "https://shop.example.com"
  NATS_STREAM_REPLICAS: "1"
  # OpenTelemetry Collector (e.g. opentelemetry-operator / Grafana Alloy) forwarding to Tempo/Jaeger
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"

ingress:
  host: shop.example.com
  tls:
    enabled: true
    secretName: shopstream-tls
    clusterIssuer: letsencrypt-prod

# Managed databases (MongoDB Atlas, Neon/RDS) live outside the cluster.
migrations:
  waitFor: ""

networkPolicy:
  externalDatabases:
    enabled: true
  otelCollectorNamespace: observability

gateway:
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10 }
  pdb: { enabled: true, minAvailable: 2 }
web:
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6 }

monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  grafanaDashboard:
    enabled: true
    namespace: monitoring
