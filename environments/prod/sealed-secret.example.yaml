# Alternative to External Secrets: Bitnami Sealed Secrets.
# Generate with (never commit the plain Secret):
#   kubectl create secret generic shopstream-secrets -n shopstream-prod \
#     --from-literal=JWT_SECRET=... --from-literal=DATABASE_URL=... \
#     --from-literal=DIRECT_URL=... --from-literal=MONGODB_URI=... \
#     --dry-run=client -o yaml | kubeseal --format yaml > sealed-secret.yaml
# then set `sealedSecret.enabled: true` and paste spec.encryptedData into prod/infra-values.yaml.
# The values below are placeholders, not real ciphertext.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: shopstream-secrets
  namespace: shopstream-prod
spec:
  encryptedData:
    JWT_SECRET: AgB...placeholder...
    DATABASE_URL: AgB...placeholder...
    DIRECT_URL: AgB...placeholder...
    MONGODB_URI: AgB...placeholder...
  template:
    metadata:
      name: shopstream-secrets
      namespace: shopstream-prod
    type: Opaque
