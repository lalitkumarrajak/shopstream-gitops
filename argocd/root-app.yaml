# The one Application you apply by hand (scripts/bootstrap-kind.sh does it for you):
#   kubectl apply -n argocd -f argocd/root-app.yaml
# Everything else is created by Argo CD from argocd/apps (app-of-apps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopstream-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lalitkumarrajak/shopstream-gitops.git
    targetRevision: main
    path: argocd/apps
    helm:
      valuesObject:
        repoURL: https://github.com/lalitkumarrajak/shopstream-gitops.git
        targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
